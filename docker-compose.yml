# NovaMercado — producto completo con `docker compose up` (ver README.md).
#
#   api        FastAPI, puerto 8000 (contrato del Anexo)
#   arranque   una vez por `up`: esquema + histórico + primer modelo si no existe
#   db         PostgreSQL propia del producto
#   mlflow     tracking + Model Registry (alias `vigente`)
#   airflow    DAG `reentrenamiento` (con su propia base `airflow-db`)
#
# Los datos publicados se montan desde ./data (no forman parte de las imágenes).

name: novamercado

x-entorno-producto: &entorno-producto
  APP_DB_NAME: ${APP_DB_NAME}
  APP_DB_USER: ${APP_DB_USER}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  APP_DB_HOST: db
  APP_DB_PORT: "5432"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODELO_NOMBRE: novamercado-pronostico
  MODELO_ALIAS: vigente

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: novamercado-api:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started  # la API tolera un MLflow caído (usa su caché)
    environment:
      <<: *entorno-producto
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_USUARIO: ${AIRFLOW_USUARIO}
      AIRFLOW_CLAVE: ${AIRFLOW_CLAVE}
      INTERVALO_MODELO_SEG: "15"
    volumes:
      - ./data:/srv/data:ro
      - api_cache_modelo:/srv/cache_modelo
    ports:
      - "8000:8000"
    healthcheck:  # vivo = responde (200 ok/degradado o 503 sin modelo)
      test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen('http://localhost:8000/health', timeout=3)\nexcept e.HTTPError: pass"]
      interval: 15s
      timeout: 5s
      retries: 20

  arranque:
    image: novamercado-api:1.0
    command: ["python", "-m", "app.arranque"]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      api:
        condition: service_started  # misma imagen: se construye una sola vez
    environment:
      <<: *entorno-producto
    volumes:
      - ./data:/srv/data:ro

  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_datos:/var/lib/postgresql/data
    ports:
      - "${APP_DB_PORT_HOST:-5433}:5432"   # solo para inspección local; los servicios usan la red interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    volumes:
      - mlflow_datos:/mlflow
    ports:
      - "${MLFLOW_PORT_HOST:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Base de metadatos de Airflow: separada de la base del producto
  airflow-db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: novamercado-airflow:1.0
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_USUARIO}:admin"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
      AIRFLOW_USUARIO: ${AIRFLOW_USUARIO}
      AIRFLOW_CLAVE: ${AIRFLOW_CLAVE}
      # Lo que necesitan las tareas del DAG
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${APP_DB_NAME}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR: /opt/proyecto/data
    # La clave del usuario sale de .env: se escribe en el archivo de SimpleAuthManager al arrancar
    command: >
      bash -c 'printf "{\"%s\": \"%s\"}" "$$AIRFLOW_USUARIO" "$$AIRFLOW_CLAVE"
      > /opt/airflow/simple_auth_manager_passwords.json.generated && exec airflow standalone'
    volumes:
      - ./data:/opt/proyecto/data:ro
      - airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 40

volumes:
  api_cache_modelo:
  db_datos:
  mlflow_datos:
  airflow_db_datos:
  airflow_logs:
