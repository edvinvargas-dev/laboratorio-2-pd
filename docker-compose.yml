# NovaMercado — producto completo con `docker compose up`.
# Fase 4: base de datos propia del producto. (API, MLflow y Airflow se agregan en fases siguientes.)

name: novamercado

services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_datos:/var/lib/postgresql/data
    ports:
      - "${APP_DB_PORT_HOST:-5433}:5432"   # solo para inspección local; los servicios usan la red interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    volumes:
      - mlflow_datos:/mlflow
    ports:
      - "${MLFLOW_PORT_HOST:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  db_datos:
  mlflow_datos:
